<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veln - Links</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #5B9BD5 0%, #7BB3E0 30%, #9ECAE8 60%, #B8D4E8 100%);
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .cloud {
      position: absolute;
      background: #FFFFFF;
      border-radius: 50px;
      opacity: 0.95;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: #FFFFFF;
      border-radius: 50%;
    }
    .c1 { width: 180px; height: 60px; top: 8%; left: -5%; animation: cloudFloat1 25s linear infinite; }
    .c1::before { width: 70px; height: 70px; top: -25px; left: 30px; }
    .c1::after { width: 90px; height: 90px; top: -35px; left: 70px; }
    .c2 { width: 160px; height: 55px; top: 15%; right: -3%; opacity: 0.9; animation: cloudFloat2 30s linear infinite; }
    .c2::before { width: 60px; height: 60px; top: -20px; left: 25px; }
    .c2::after { width: 80px; height: 80px; top: -30px; left: 60px; }
    .c3 { width: 140px; height: 50px; top: 65%; left: 5%; opacity: 0.8; animation: cloudFloat1 35s linear infinite reverse; }
    .c3::before { width: 55px; height: 55px; top: -18px; left: 20px; }
    .c3::after { width: 70px; height: 70px; top: -25px; left: 55px; }
    .c4 { width: 150px; height: 52px; top: 75%; right: 8%; opacity: 0.85; animation: cloudFloat2 28s linear infinite reverse; }
    .c4::before { width: 58px; height: 58px; top: -20px; left: 22px; }
    .c4::after { width: 75px; height: 75px; top: -28px; left: 58px; }
    .c5 { width: 130px; height: 45px; top: 35%; left: -8%; opacity: 0.7; animation: cloudFloat1 32s linear infinite; }
    .c5::before { width: 50px; height: 50px; top: -15px; left: 18px; }
    .c5::after { width: 65px; height: 65px; top: -22px; left: 48px; }
    .c6 { width: 170px; height: 58px; top: 50%; right: -6%; opacity: 0.75; animation: cloudFloat2 26s linear infinite; }
    .c6::before { width: 65px; height: 65px; top: -22px; left: 28px; }
    .c6::after { width: 85px; height: 85px; top: -32px; left: 68px; }
    
    .planet-wrap { position: absolute; pointer-events: none; z-index: 1; }
    .planet { border-radius: 50%; position: relative; }
    .planet-ring {
      position: absolute;
      top: 50%; left: 50%;
      border: 3px solid rgba(255,200,100,0.8);
      border-radius: 50%;
    }
    .p1 { top: 6%; left: 8%; animation: planetFloat1 8s ease-in-out infinite; }
    .p1 .planet { width: 50px; height: 50px; background: linear-gradient(135deg, #26A69A, #00897B); box-shadow: 0 4px 15px rgba(38,166,154,0.5), inset -5px -5px 10px rgba(0,0,0,0.15); }
    .p1 .planet-ring { width: 70px; height: 12px; transform: translate(-50%, -50%) rotate(-20deg); }
    .p2 { top: 10%; right: 10%; animation: planetFloat2 10s ease-in-out infinite; }
    .p2 .planet { width: 55px; height: 55px; background: linear-gradient(135deg, #F4A460, #D2691E); box-shadow: 0 4px 15px rgba(244,164,96,0.5), inset -5px -5px 10px rgba(0,0,0,0.15); }
    .p2 .planet-ring { width: 80px; height: 14px; transform: translate(-50%, -50%) rotate(15deg); border-color: rgba(255,220,150,0.7); }
    .p3 { top: 38%; left: 3%; animation: planetFloat3 7s ease-in-out infinite; }
    .p3 .planet { width: 35px; height: 35px; background: linear-gradient(135deg, #43A047, #1976D2); box-shadow: 0 3px 10px rgba(25,118,210,0.4); }
    .p4 { top: 28%; right: 5%; animation: planetFloat1 9s ease-in-out infinite reverse; }
    .p4 .planet { width: 28px; height: 28px; background: linear-gradient(135deg, #EF5350, #D32F2F); box-shadow: 0 3px 10px rgba(239,83,80,0.4); }
    .p5 { bottom: 15%; right: 6%; animation: planetFloat2 11s ease-in-out infinite; }
    .p5 .planet { width: 45px; height: 45px; background: linear-gradient(135deg, #8E24AA, #6A1B9A); box-shadow: 0 4px 15px rgba(142,36,170,0.5); }
    .p5 .planet-ring { width: 65px; height: 10px; transform: translate(-50%, -50%) rotate(-10deg); border-color: rgba(200,150,255,0.6); border-width: 2px; }
    
    .plane { position: absolute; pointer-events: none; z-index: 1; }
    .pl1 { top: 18%; left: 25%; animation: planeFloat1 12s ease-in-out infinite; }
    .pl1 svg { transform: rotate(-15deg); }
    .pl2 { top: 55%; right: 20%; animation: planeFloat2 15s ease-in-out infinite; }
    .pl2 svg { transform: rotate(20deg); }
    .pl3 { bottom: 25%; left: 18%; animation: planeFloat1 14s ease-in-out infinite reverse; }
    .pl3 svg { transform: rotate(-25deg); }
    
    .rocket { position: absolute; bottom: 3%; left: 3%; pointer-events: none; z-index: 1; animation: rocketFloat 6s ease-in-out infinite; }
    .astro { position: absolute; bottom: 2%; right: 2%; pointer-events: none; z-index: 1; animation: astronautFloat 7s ease-in-out infinite; }
    
    .card {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #C8E6C9 0%, #A5D6A7 50%, #81C784 100%);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 4px solid #2E7D32;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.5), 0 0 0 2px rgba(46,125,50,0.3);
    }
    
    .avatar-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 16px; }
    .avatar-ring {
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00ACC1, #00838F, #00ACC1);
      animation: spin 6s linear infinite;
      opacity: 0.9;
    }
    .avatar {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #1A237E;
      box-shadow: 0 8px 25px rgba(0,172,193,0.4), 0 0 0 3px rgba(26,35,126,0.2);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    h1 { font-size: 38px; font-weight: 900; color: #1A237E; margin-bottom: 4px; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(255,255,255,0.5), 0 3px 6px rgba(0,0,0,0.15); }
    .handle { font-size: 15px; color: #00695C; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
    .bio { font-size: 16px; color: #3E2723; direction: rtl; font-weight: 700; margin-bottom: 28px; text-shadow: 0 1px 2px rgba(255,255,255,0.4); }
    
    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      transition: all 0.3s ease;
      border: 3px solid;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .link-btn:hover { transform: translateY(-3px) scale(1.02); }
    .link-btn .icon-box {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .link-btn .info { text-align: right; flex: 1; }
    .link-btn .info .title { font-size: 17px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .link-btn .info .sub { font-size: 13px; opacity: 0.95; margin-top: 2px; font-weight: 600; }
    
    .youtube { background: linear-gradient(135deg, #D32F2F, #B71C1C); border-color: #8B0000; box-shadow: 0 6px 20px rgba(211,47,47,0.4); }
    .youtube:hover { box-shadow: 0 12px 35px rgba(211,47,47,0.6); }
    .youtube .icon-box { background: rgba(255,255,255,0.2); }
    
    .tiktok { background: linear-gradient(135deg, #212121, #424242); border-color: #000000; box-shadow: 0 6px 20px rgba(33,33,33,0.4); }
    .tiktok:hover { box-shadow: 0 12px 35px rgba(33,33,33,0.6); }
    .tiktok .icon-box { background: rgba(255,255,255,0.15); }
    
    .discord-coming {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #90A4AE, #B0BEC5);
      color: #263238;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      border: 3px dashed #546E7A;
      box-shadow: 0 4px 15px rgba(84,110,122,0.2);
      cursor: not-allowed;
    }
    .discord-coming .icon-box {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.4);
    }
    .soon-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #FF6F00;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(255,111,0,0.6);
      display: inline-block;
      margin-left: 6px;
    }
    
    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 3px solid rgba(46,125,50,0.2);
      font-size: 15px;
      color: #1B5E20;
      direction: rtl;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(255,255,255,0.4);
    }
    
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.6); } }
    @keyframes cloudFloat1 { 0% { transform: translateX(-50px); } 50% { transform: translateX(30px); } 100% { transform: translateX(-50px); } }
    @keyframes cloudFloat2 { 0% { transform: translateX(30px); } 50% { transform: translateX(-40px); } 100% { transform: translateX(30px); } }
    @keyframes planetFloat1 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
    @keyframes planetFloat2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(-3deg); } }
    @keyframes planetFloat3 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes planeFloat1 { 0%,100% { transform: translate(0,0) rotate(-15deg); } 25% { transform: translate(15px,-10px) rotate(-10deg); } 50% { transform: translate(5px,-5px) rotate(-18deg); } 75% { transform: translate(-10px,5px) rotate(-12deg); } }
    @keyframes planeFloat2 { 0%,100% { transform: translate(0,0) rotate(20deg); } 33% { transform: translate(-12px,8px) rotate(15deg); } 66% { transform: translate(8px,-8px) rotate(25deg); } }
    @keyframes rocketFloat { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-20px) rotate(2deg); } }
    @keyframes astronautFloat { 0%,100% { transform: translateY(0) rotate(3deg); } 50% { transform: translateY(-15px) rotate(-3deg); } }
  </style>
</head>
